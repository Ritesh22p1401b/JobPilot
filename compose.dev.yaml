# OPTIONAL containerized development. Normal Windows development needs no Docker (see README).
#   docker compose -f compose.yaml -f compose.dev.yaml up --build
#
# Source is bind-mounted with hot reload, and ports are published on 127.0.0.1 only. Postgres uses host port 5433
# so it doesn't clash with a local PostgreSQL service. Never combine this file with compose.prod.yaml.

x-dev-env: &dev-env
  APP_ENV: development
  LOG_LEVEL: DEBUG
  CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000

services:
  postgres:
    ports:
      - "127.0.0.1:5433:5432"

  qdrant:
    ports:
      - "127.0.0.1:6333:6333"

  migrate:
    environment:
      <<: *dev-env
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic

  backend:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    environment:
      <<: *dev-env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/app:/app/app

  worker:
    environment:
      <<: *dev-env
    volumes:
      - ./backend/app:/app/app

  frontend:
    image: jobpilot-frontend:dev
    build:
      target: dev
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend/src:/app/src
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      start_period: 120s
